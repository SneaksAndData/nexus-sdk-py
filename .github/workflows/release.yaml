name: Release wheels
run-name: Release CPython wheels from ${{github.ref_name}} by @${{ github.actor }}

on: workflow_dispatch

jobs:
  macos:
    name: Create a MacOS Release
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags')

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax

      - name: Get project version
        uses: SneaksAndData/github-actions/generate_version@v0.1.11
        id: version

      - name: Install, Configure Poetry and Build
        env:
          VERSION: ${{steps.version.outputs.version}}
        run: |
          set -e

          curl -sSL https://install.python-poetry.org | python3 -
          
          export PATH="/Users/runner/.local/bin:$PATH"
          
          poetry install --all-extras

          sed -i '' "s/version = \"0.0.0\"/version = \"${VERSION:1}\"/" pyproject.toml
          echo "__version__ = '${VERSION:1}'" > ./nexus_client_sdk/_version.py
          
          cext_version=$(cat nexus_client_sdk/.extensions/cext_version)
          
          curl -L https://github.com/SneaksAndData/nexus-sdk-go/releases/download/v$cext_version/nexus_sdk_darwin_arm64.tar.gz > nexus_sdk_darwin_arm64.tar.gz
          mkdir cext && tar -xvzf nexus_sdk_darwin_arm64.tar.gz -C cext && mv cext/dist/nexus_sdk_darwin_arm64.so nexus_client_sdk/.extensions/nexus_sdk.so
          
          poetry build --format wheel \
           && poetry run wheel tags \
            --platform-tag=macosx_13_0_arm64 \
            --python-tag=cp311 \
            --abi-tag=cp311 \
            --remove \
            dist/nexus_client_sdk-"${VERSION:1}"-py3-none-any.whl
          
          tar -czf wheel_macosx_13_0_arm64.tar.gz dist/
          mkdir release && mv wheel_macosx_13_0_arm64.tar.gz release/

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{steps.version.outputs.version}}
        run: |
          gh release upload $VERSION release/*.*

  linux_arm64:
    name: Create ARM64 Release
    runs-on: ubuntu-24.04-arm
    if: startsWith(github.ref, 'refs/tags')

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax

      - name: Get project version
        uses: SneaksAndData/github-actions/generate_version@v0.1.11
        id: version

      - name: Install, Configure Poetry and Build
        shell: bash
        env:
          VERSION: ${{steps.version.outputs.version}}
        run: |
          set -euo pipefail

          curl -sSL https://install.python-poetry.org | python3 -
          
          poetry install --all-extras

          sed -i "s/version = \"0.0.0\"/version = \"${VERSION:1}\"/" pyproject.toml
          echo "__version__ = '${VERSION:1}'" > ./nexus_client_sdk/_version.py
          
          cext_version=$(cat nexus_client_sdk/.extensions/cext_version)
          
          curl -L https://github.com/SneaksAndData/nexus-sdk-go/releases/download/v$cext_version/nexus_sdk_linux_arm64.tar.gz > nexus_sdk_linux_arm64.tar.gz
          mkdir cext && tar -xvzf nexus_sdk_linux_arm64.tar.gz -C cext && mv cext/dist/nexus_sdk_linux_arm64.so nexus_client_sdk/.extensions/nexus_sdk.so          
          
          poetry build --format wheel \
          && poetry run wheel tags \
            --platform-tag=manylinux_2_28_aarch64 \
            --python-tag=cp311 \
            --abi-tag=cp311 \
            --remove dist/nexus_client_sdk-"${VERSION:1}"-py3-none-any.whl
          
          tar -czf wheel_manylinux_2_28_aarch64.tar.gz dist/
          mkdir release && mv wheel_manylinux_2_28_aarch64.tar.gz release/

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{steps.version.outputs.version}}
        run: |
          gh release upload $VERSION release/*.*

  linux_amd64:
    name: Create AMD64 Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified

      - name: Get project version
        uses: SneaksAndData/github-actions/generate_version@v0.1.11
        id: version

      - name: Install, Configure Poetry and Build
        shell: bash
        env:
          VERSION: ${{steps.version.outputs.version}}
        run: |
          set -euo pipefail

          curl -sSL https://install.python-poetry.org | python3 -
          
          poetry install --all-extras

          sed -i "s/version = \"0.0.0\"/version = \"${VERSION:1}\"/" pyproject.toml
          echo "__version__ = '${VERSION:1}'" > ./nexus_client_sdk/_version.py
          
          cext_version=$(cat nexus_client_sdk/.extensions/cext_version)
          
          curl -L https://github.com/SneaksAndData/nexus-sdk-go/releases/download/v$cext_version/nexus_sdk_linux_amd64.tar.gz > nexus_sdk_linux_amd64.tar.gz
          mkdir cext && tar -xvzf nexus_sdk_linux_amd64.tar.gz -C cext && mv cext/dist/nexus_sdk_linux_amd64.so nexus_client_sdk/.extensions/nexus_sdk.so             
          
          poetry build --format wheel \
          && poetry run wheel tags \
            --platform-tag=manylinux_2_28_x86_64 \
            --python-tag=cp311 \
            --abi-tag=cp311 \
            --remove dist/nexus_client_sdk-"${VERSION:1}"-py3-none-any.whl
          
          tar -czf wheel_manylinux_2_28_x86_64.tar.gz dist/
          mkdir release && mv wheel_manylinux_2_28_x86_64.tar.gz release/

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{steps.version.outputs.version}}
        run: |
          gh release upload $VERSION release/*.*          
