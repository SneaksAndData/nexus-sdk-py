name: Release wheels
run-name: Release CPython wheels from ${{github.ref_name}} by @${{ github.actor }}

on: workflow_dispatch

permissions: {}

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags')
    permissions:
      contents: write # upload release assets

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Create a MacOS Release
            runner: macos-latest
            platform-tag: macosx_13_0_arm64
          - name: Create ARM64 Release
            runner: ubuntu-24.04-arm
            platform-tag: manylinux_2_28_aarch64
          - name: Create AMD64 Release
            runner: ubuntu-latest
            platform-tag: manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install

      - name: Get project version
        uses: SneaksAndData/github-actions/generate_version@42d1e71a9297cc52e824d9405604073a1da7a5cf # v0.1.13
        id: version

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build wheel
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM_TAG: ${{ matrix.platform-tag }}
        run: |
          set -euo pipefail

          # generate_version emits a leading "v" that is not part of the PEP 440 version.
          version="${VERSION:1}"

          uv version --no-sync "$version"
          echo "__version__ = \"$version\"" > ./src/nexus_client_sdk/_version.py

          # The .so is gitignored, so it has to be fetched before the wheel is built.
          just cext

          uv build --wheel

          # The wheel embeds a platform-specific .so, so it must not stay py3-none-any.
          uv run wheel tags \
            --platform-tag="$PLATFORM_TAG" \
            --python-tag=cp311 \
            --abi-tag=cp311 \
            --remove \
            dist/nexus_client_sdk-"$version"-py3-none-any.whl

          tar -czf "wheel_$PLATFORM_TAG.tar.gz" dist/
          mkdir release && mv "wheel_$PLATFORM_TAG.tar.gz" release/

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$VERSION" release/*.*
