name: Publish to PyPi
run-name: Publish ${{github.ref_name}} to PyPi by @${{ github.actor }}

on: workflow_dispatch
jobs:
  release_to_pypi:
    name: Release distribution to Pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
      - name: Install and Configure Poetry and Prepare Publish
        run: |
          set -e
          
          curl -sSL https://install.python-poetry.org | python3 -
          
          version=$(git describe --tags --abbrev=7)
          sed -i "s/version = \"0.0.0\"/version = \"${version:1}\"/" pyproject.toml
          echo "__version__ = '${version:1}'" > ./nexus_sdk/_version.py
          
          curl -L https://github.com/SneaksAndData/nexus-sdk-py/releases/download/$version/wheel_manylinux_2_28_x86_64.tar.gz > wheel_manylinux_2_28_x86_64.tar.gz
          curl -L https://github.com/SneaksAndData/nexus-sdk-py/releases/download/$version/wheel_manylinux_2_28_aarch64.tar.gz > wheel_manylinux_2_28_aarch64.tar.gz
          curl -L https://github.com/SneaksAndData/nexus-sdk-py/releases/download/$version/wheel_macosx_13_0_arm64.tar.gz > wheel_macosx_13_0_arm64.tar.gz
          
          mkdir macos && tar -xvzf wheel_macosx_13_0_arm64.tar.gz -C macos
          mkdir linux_arm64 && tar -xvzf wheel_manylinux_2_28_aarch64.tar.gz -C linux_arm64
          mkdir linux_amd64 && tar -xvzf wheel_manylinux_2_28_x86_64.tar.gz -C linux_amd64
          
          mkdir dist \
           && mv macos/dist/* dist/ \
           && mv linux_arm64/dist/* dist/ \
           && mv linux_amd64/dist/* dist/ \

      - name: Publish distribution 📦 to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        if: ${{ startsWith(github.ref, 'refs/tags') }}
        run: |
          set -e

          poetry publish
