name: Publish to PyPi
run-name: Publish ${{github.ref_name}} to PyPi by @${{ github.actor }}

on: workflow_dispatch

permissions: {}

jobs:
  collect:
    name: Collect artifacts
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect wheels built by the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(git describe --tags --abbrev=7)

          gh release download "$version" \
            --pattern 'wheel_manylinux_2_28_x86_64.tar.gz' \
            --pattern 'wheel_manylinux_2_28_aarch64.tar.gz' \
            --pattern 'wheel_macosx_13_0_arm64.tar.gz'

          # Each archive carries a dist/ directory holding one platform-tagged wheel,
          # so extracting them all in place accumulates every wheel under dist/.
          for archive in wheel_*.tar.gz; do
            tar -xzf "$archive"
          done

          ls -la dist/

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPi
    needs:
      - collect
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish
