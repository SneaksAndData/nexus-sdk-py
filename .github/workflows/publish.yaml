name: Publish to PyPi
run-name: Publish ${{github.ref_name}} to PyPi by @${{ github.actor }}

on: workflow_dispatch

permissions: {}

jobs:
  release_to_pypi:
    name: Release distribution to PyPi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Collect wheels built by the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(git describe --tags --abbrev=7)

          gh release download "$version" \
            --pattern 'wheel_manylinux_2_28_x86_64.tar.gz' \
            --pattern 'wheel_manylinux_2_28_aarch64.tar.gz' \
            --pattern 'wheel_macosx_13_0_arm64.tar.gz'

          # Each archive carries a dist/ directory holding one platform-tagged wheel,
          # so extracting them all in place accumulates every wheel under dist/.
          for archive in wheel_*.tar.gz; do
            tar -xzf "$archive"
          done

          ls -la dist/

      - name: Publish distribution 📦 to PyPI
        run: uv publish # zizmor: ignore[use-trusted-publishing]
