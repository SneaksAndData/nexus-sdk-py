name: Validate code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  validate_commit_py311:
    name: Validate commit
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # required for dependabot PRs
      pull-requests: write # required for dependabot PRs; coverage PR comment
      contents: read       # required for dependabot PRs
    if: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          #architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Setup integration tests
        run: just up

      - name: Download C-Shared Build of Go SDK
        run: just cext

      - name: Install Poetry and dependencies
        uses: SneaksAndData/github-actions/install_poetry@42d1e71a9297cc52e824d9405604073a1da7a5cf # v0.1.13
        with:
          install_extras: all

      - name: Unit test
        run: |
          set -euo pipefail

          just test --junitxml=junit/test-results.xml | tee pytest-coverage.txt

      - name: Get logs from application pods
        if: always()
        run: |
          kubectl describe pods --namespace default || true

      - name: Publish Code Coverage
        uses: MishaKav/pytest-coverage-comment@9516bf7f32a9229cf18d5e1717ae387c7154f279 # v1.13.0
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./junit/test-results.xml
