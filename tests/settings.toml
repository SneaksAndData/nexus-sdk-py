# Name of this algorithm in the Nexus deployment
algorithm_name = "hello-world"

# Nexus client configuration
[client]
# Nexus Receiver address
receiver = "http://localhost:8081"

# Nexus Scheduler address
scheduler = "http://localhost:8080"

# Configurations for nexus_client_sdk.nexus.algorithms.RemoteAlgorithm
[remote_algorithm]

# If set to "1" will only create run metadata
dry_run = "0"

# Import path to a compression method to use, if remote payload compression is required
compression_import_path = ""

# Import path to a decompression method to require on the receiving end, if remote payload is compressed
decompression_import_path = ""

[result]
# Storage client to use when saving serialized result and generating pre-signed URL for it
storage_client_class = "adapta.storage.blob.s3_storage_client.S3StorageClient"

# Base path to use when recording results. Protocol must be supported by storage_client_class
output_path = "s3a://nexus-sdk-tests/result"

# RESULT SERIALIZERS - classes used to serialize AlgorithmResult objects to desired formats
[result.serializers]
json_format = "adapta.storage.models.formatters.PandasDataFrameJsonSerializationFormat"

[telemetry]
# Base path to use when recording input and user telemetry
output_path = "s3a://nexus-sdk-tests/telemetry"

# INPUTS - configuration for data read interfaces
[inputs]

# External data sockets to be available to InputReader instances
[[inputs.sockets]]
alias = "localfile1"
data_path = "local+file:///tmp/file1.json"
data_format = "text"

[[inputs.sockets]]
alias = "localfile2"
data_path = "local+file:///tmp/file2.json"
data_format = "text"

#sockets = []

    # Query Enabled Store configuration
    [inputs.query_enabled_store]

    enabled = "1"

    # Connection string for QES
    connection_string = "qes://engine=LOCAL;plaintext_credentials={};settings={}"

    # Settings for AstraClientModule
    [inputs.astra_client]

    # Enabled injection of AstraClientModule
    enabled = "0"

    # Astra Keyspace
    # keyspace = ""

    # Secure Connection Bundle, base64-encoded
    # bundle = ""

    # Astra Client ID
    # client_id = ""

    # Astra Client Secret
    # client_secret = ""

[logging]
# Global template to apply to ALL log messages emitted by framework loggers. This setting conflicts with
# with_log_enricher() and might be removed in the future
fixed_template = ""

# Delimiter to use for global template
fixed_template_delimiter = ""

# Framework log level. Defaults to INFO if not provided
# log_level = "ERROR"

    [logging.datadog]
    logger_configuration = "{'buffer_size': 1}"

[metrics]
# Implementation of MetricsProvider used to submit default framework runtime and user-level metrics
provider = "adapta.metrics.providers.datadog_provider.DatadogMetricsProvider"

# Configuration for the metrics provider (JSON string)
provider_configuration = '{"init_args": {"metric_namespace": "sdk"}, "protocol": "uds"}'