dynaconf_merge = true
# Name of this algorithm in the Nexus deployment
algorithm_name = "hello-world"

# Nexus runtime configuration
[runtime]

# Nexus algorithm implementations to activate. At least one must be supplied
algorithms = ["tests.sample_algorithm.sample_main.TestAlgorithm"]

# additional modules for the DI container
# use these to provide custom services
additional_modules = [
    "nexus_client_sdk.nexus.core.app_dependencies.QueryEnabledStoreModule",
    "nexus_client_sdk.nexus.core.app_dependencies.ExternalSocketsModule",
    "nexus_client_sdk.nexus.core.app_dependencies.CompressorModule",
]

# optional function that applies additional context to all logs emitted by Nexus.
# accepts p: AlgorithmPayload and n: NexusDefaultArguments parameters
log_enrichment_function = "tests.sample_algorithm.sample_main.enrich_from_payload"

# optional function that applies additional tags (as metadata) to all logs emitted by Nexus.
# accepts p: AlgorithmPayload and n: NexusDefaultArguments parameters
log_tagging_function = "tests.sample_algorithm.sample_main.tags_from_payload"

# optional function that applies additional tagging to all metrics emitted by Nexus.
# accepts p: AlgorithmPayload and n: NexusDefaultArguments parameters
metric_tagging_function = "tests.sample_algorithm.sample_main.tag_metrics"

configuration_types = [
    "tests.conftest.TestAlgorithmConfiguration"
]

[runtime.payload]

# payload types supported by this Nexus application. At least one must be provided
types = ["tests.conftest.TestAlgorithmPayload"]

# optional raw payload serialization for later analysis
# you can serialize payload via user telemetry, however that won't catch failed payloads
# for production scenarios recommended setup is to pair this setting with `on_failure` and
# a user telemetry recorder for successful runs
# Serialization is done via the same Telemetry API as regular user telemetry and uses a base path from telemetry settings
# Using `always` in production is also an option, unless you must maintain low running times
#
# Available values:
# off - do not serialize
# on_failure - serialize if none of the provided payload types match the payload
# always - always serialize the payload
serialization_mode = "always"

# Manage applicaton response to various error types
[runtime.exceptions]

# default error to use for remapping
[runtime.exceptions.defaults]
global_default = 'nexus_client_sdk.nexus.exceptions._nexus_error.FatalNexusError'

# class-scoped exceptions
[[runtime.exceptions.scoped]]
# fully qualified class name (module name + name)
class_name = 'nexus_client_sdk.nexus.abstractions.algorithm_cache.InputCache'
# errors to remap. provide [] to remap all errors to an alternative default
errors = [
    'cassandra.Timeout',
    'cassandra.Unavailable',
    'cassandra.ReadTimeout',
    'cassandra.WriteTimeout',
    'cassandra.OperationTimedOut',
    'cassandra.ReadFailure',
    'cassandra.CoordinationFailure'
]
# target error to remap to
target = 'nexus_client_sdk.nexus.exceptions.cache_errors.TransientCachingError'

[[runtime.exceptions.scoped]]
# fully qualified class name (module name + name)
class_name = 'nexus_client_sdk.nexus.abstractions.algorithm_cache.InputCache'
# errors to remap. provide [] to remap all errors to an alternative default
errors = [
    'cassandra.Unauthorized',
    'cassandra.RequestValidationException',
    'cassandra.AuthenticationFailed'
]
# target error to remap to
target = 'nexus_client_sdk.nexus.exceptions.cache_errors.FatalCachingError'

[[runtime.exceptions.scoped]]
# fully qualified class name (module name + name)
class_name = 'nexus_client_sdk.nexus.abstractions.algorithm_cache.InputCache'
# [] remaps errors that didn't match any other list to an alternative default
errors = []
# target error to remap to
target = 'nexus_client_sdk.nexus.exceptions.cache_errors.FatalCachingError'

# Result processing and serialization
[result]

# Base path to use when recording results. Protocol must be supported by storage_client_class
output_path = "s3a://nexus-sdk-tests/result"

# Storage client to use when saving serialized result and generating pre-signed URL for it
storage_client_class = "adapta.storage.blob.s3_storage_client.S3StorageClient"

# RESULT SERIALIZERS - classes available to serialize AlgorithmResult objects to desired formats
serializers = [
    "adapta.storage.models.formatters.PandasDataFrameJsonSerializationFormat"
]

# Run telemetry recording
[telemetry]
# Base path to use when recording input and user telemetry
output_path = "s3a://nexus-sdk-tests/telemetry"

# TELEMETRY SERIALIZERS - classes available to serialize Algorithm inputs and UserTelemetry classes
serializers = [
    "adapta.storage.models.formatters.PandasDataFrameJsonSerializationFormat"
]

   # Input telemetry configurations. Inputs are dataframes and other objects passed to algorithm class from processors
   [telemetry.input]
     # Control whether algorithm inputs are recorded as telemetry
     enabled = "1"

    # User telemetry configurations. User telemetry comes from custom classes provided by algorithm developers that extend UserTelemetry interface
    # User telemetry is often used for measure health, output quality and other data that is important for observing the runs in a live system
    [telemetry.user]
      # Control whether user telemetry recording is enabled
      enabled = "1"

      # Provide a list of user telemetry classes to execute. If empty, all user telemetry will be recorded
      # THIS IS A RESERVATION FOR https://github.com/SneaksAndData/nexus-sdk-py/issues/126
      classes = []

# INPUTS - configuration for data read interfaces
[inputs]

# External data sockets to be injected into InputReader instances
#[[inputs.sockets]]
#alias = "localfile1"
#data_path = "local+file:///tmp/file1.json"
#data_format = "text"
#
#[[inputs.sockets]]
#alias = "localfile2"
#data_path = "local+file:///tmp/file2.json"
#data_format = "text"

# default is empty list
sockets = []

    # Query Enabled Store configuration
    [inputs.query_enabled_store]

    enabled = "0"

    # Connection string for QES
    connection_string = ""

    # Settings for AstraClientModule
    [inputs.astra_client]

    # Enabled injection of AstraClientModule
    enabled = "0"

# Framework-powered logging
[logging]
# Global template to apply to ALL log messages emitted by framework loggers. This setting conflicts with
# with_log_enricher() and might be removed in the future
fixed_template = ""

# Delimiter to use for global template
fixed_template_delimiter = ""

# Framework log level. Defaults to INFO if not provided
# log_level = "ERROR"

    # Datadog API handler settings
    [logging.datadog]
    # If enabled, remember to add PROTEUS__DD_API_KEY, PROTEUS__DD_APP_KEY and PROTEUS__DD_SITE to your environment
    # variables
    enabled = 0
    buffer_size = 1
    debug = "False"
    max_flush_retry_time = 30
    ignore_flush_failure = "True"
    fixed_tags = {}
    attach_interrupt_handlers = "True"

[metrics]
# Implementation of MetricsProvider used to submit default framework runtime and user-level metrics
provider = "adapta.metrics.providers.void_provider.VoidMetricsProvider"

# Initialization configuration for the MetricsProvider defined under `provider`
init_args = {"metric_namespace" = "sdk"}
